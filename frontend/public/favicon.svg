<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CodeLens">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2997ff"/>
      <stop offset="0.55" stop-color="#5e5ce6"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="32" y1="2" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- app-icon tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="32" rx="15" fill="url(#sheen)"/>
  <!-- lens -->
  <circle cx="28" cy="28" r="14" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-width="4.5"/>
  <path d="M38.5 38.5 L48.5 48.5" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- a tiny binary tree seen through the lens -->
  <path d="M28 22.5 L22.5 32 M28 22.5 L33.5 32" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="28" cy="22.5" r="3.1" fill="#fff"/>
  <circle cx="22.5" cy="32" r="3.1" fill="#fff"/>
  <circle cx="33.5" cy="32" r="3.1" fill="#fff"/>
</svg>
